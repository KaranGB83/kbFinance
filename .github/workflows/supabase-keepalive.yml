name: Supabase Keep-Alive

on:
  schedule:
    # Twice a week: Monday and Thursday at 03:00 UTC (well within the 7-day pause window)
    - cron: "0 3 * * 1,4"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (heartbeat table)
        run: |
          response=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP status: $response"
          cat /tmp/body.json

          if [ "$response" -ge 400 ]; then
            echo "::error::Supabase ping failed with status $response"
            exit 1
          fi
